<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">그랜드블랑 오시는 길 약도</title>
  <desc id="desc">아래쪽의 센텀시티역 13번 출구와 신세계 센텀시티 버스정류장에서 위쪽의 한샘빌딩 그랜드블랑까지 주변 도로와 건물을 표시한 약도</desc>
  <defs>
    <style>
      .label{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#252525}
      .minor{font-size:26px;font-weight:500;fill:#686868}
      .place{font-size:32px;font-weight:700}
      .road{fill:#ececec;stroke:#d5d5d5;stroke-width:2}
      .block{fill:#f5f5f5;stroke:#cfcfcf;stroke-width:2}
    </style>
  </defs>

  <rect width="900" height="1100" fill="#fff"/>
  <rect x="30" y="30" width="840" height="1040" rx="22" fill="#fff" stroke="#dedede" stroke-width="2"/>

  <!-- 첨부 약도를 보행 방향에 맞게 180도 돌린 도로 배치 -->
  <path class="road" d="M70 970H830V876H70Z"/>
  <path class="road" d="M368 92H488V910H368Z"/>
  <path class="road" d="M88 378H812V462H88Z"/>
  <path class="road" d="M88 636H812V710H88Z"/>
  <path d="M80 70L196 70L88 930L42 930Z" fill="#f2f2f2" stroke="#d9d9d9" stroke-width="2"/>

  <!-- 수영강: 보행자 시점에서 오른쪽 -->
  <rect x="817" y="84" width="34" height="776" rx="17" fill="#f0f0f0"/>
  <text class="label minor" x="840" y="505" text-anchor="middle" transform="rotate(90 840 505)">수영강</text>

  <!-- 위쪽 도착지 -->
  <rect x="500" y="92" width="258" height="176" rx="14" fill="#333"/>
  <g transform="translate(607 106) scale(.65)">
    <path d="M32 0C14 0 0 14 0 32c0 25 32 57 32 57s32-32 32-57C64 14 50 0 32 0Z" fill="#fff"/>
    <circle cx="32" cy="31" r="11" fill="#333"/>
  </g>
  <text x="628" y="194" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="32" font-weight="800" fill="#fff">그랜드블랑</text>
  <text x="628" y="232" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="25" font-weight="700" fill="#fff">한샘빌딩 7·8층</text>

  <!-- 주변 건물: 첨부 자료에 공통으로 표시된 시설 -->
  <rect class="block" x="140" y="110" width="184" height="218" rx="10"/>
  <text class="label place" x="232" y="208" text-anchor="middle">BEXCO</text>
  <text class="label minor" x="232" y="241" text-anchor="middle">제2전시장</text>

  <rect class="block" x="518" y="292" width="240" height="70" rx="10"/>
  <text class="label place" x="638" y="336" text-anchor="middle">리더스마크</text>

  <rect class="block" x="140" y="486" width="184" height="122" rx="10"/>
  <text class="label place" x="232" y="544" text-anchor="middle">BEXCO</text>
  <text class="label minor" x="232" y="578" text-anchor="middle">제1전시장</text>

  <rect class="block" x="506" y="488" width="246" height="120" rx="10"/>
  <text class="label place" x="629" y="545" text-anchor="middle">WBC</text>
  <text class="label minor" x="629" y="579" text-anchor="middle">월드비즈니스센터</text>

  <rect class="block" x="150" y="732" width="178" height="98" rx="10"/>
  <text class="label place" x="239" y="787" text-anchor="middle">센텀호텔</text>

  <rect class="block" x="516" y="732" width="236" height="98" rx="10"/>
  <text class="label place" x="634" y="774" text-anchor="middle">갤러리움</text>
  <text class="label minor" x="634" y="806" text-anchor="middle">롯데갤러리움 방향</text>

  <!-- 센텀시티역과 13번 출구: 출발 지점은 약도 하단 -->
  <rect x="180" y="884" width="540" height="76" rx="14" fill="#303030"/>
  <circle cx="231" cy="922" r="25" fill="#fff"/>
  <text class="label" x="231" y="931" text-anchor="middle" font-size="26" font-weight="900">2</text>
  <text x="474" y="920" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="30" font-weight="800" fill="#fff">2호선 센텀시티역</text>
  <text x="474" y="946" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" font-weight="500" fill="#d8d8d8">출발</text>

  <g transform="translate(536 824)">
    <circle cx="36" cy="36" r="34" fill="#fff" stroke="#303030" stroke-width="5"/>
    <text class="label" x="36" y="46" text-anchor="middle" font-size="30" font-weight="900">13</text>
    <text class="label" x="78" y="45" font-size="28" font-weight="800">번 출구</text>
  </g>

  <!-- 버스정류장: 첨부 안내문의 하차 지점 -->
  <g transform="translate(570 976)">
    <rect width="262" height="72" rx="12" fill="#fff" stroke="#bdbdbd" stroke-width="2"/>
    <g transform="translate(12 13)">
      <rect width="42" height="37" rx="6" fill="#4a4a4a"/>
      <rect x="7" y="7" width="28" height="12" rx="2" fill="#fff"/>
      <circle cx="10" cy="38" r="5" fill="#333"/><circle cx="32" cy="38" r="5" fill="#333"/>
    </g>
    <text class="label" x="62" y="30" font-size="22" font-weight="800">신세계 센텀시티</text>
    <text class="label minor" x="62" y="57" font-size="20">버스정류장</text>
  </g>

  <!-- 별도의 경로선 없이 시선 방향만 표시 -->
  <path d="M430 842V768" fill="none" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <path d="M430 748L416 776H444Z" fill="#555"/>
  <text class="label minor" x="430" y="728" text-anchor="middle" font-weight="700">그랜드블랑 방면</text>

  <text class="label minor" x="450" y="1050" text-anchor="middle">13번 출구에서 도보 약 5분</text>
</svg>
